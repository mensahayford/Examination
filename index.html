<!DOCTYPE html>
<html lang="en"></html>
<html>
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensah Hayford - FCM.41.020.077.24</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="script/main.js"></script>
  
</head>


<body>



  <a-scene>


    <!-- CAMERA -->
    <a-entity position="2 4 100" rotation="0 0 0">
      <a-camera look-controls wasd-controls="acceleration: 45; fly: false" fov="80"></a-camera>
    </a-entity>

    <!-- ASSETS -->
    <a-assets timeout="30000">
      <a-asset-item id="ferrari"    src="assets/models/ferrari/scene.gltf"></a-asset-item>
      <a-asset-item id="villaModel"   src="assets/models/villa_house/scene.gltf"></a-asset-item>
      <a-asset-item id="poolModel"    src="assets/models/pool/scene.gltf"></a-asset-item>
      <a-asset-item id="treeModel"    src="assets/models/tree/scene.gltf"></a-asset-item>
      <a-asset-item id="bugattiModel" src="assets/models/bugatti/scene.gltf"></a-asset-item>
      <a-asset-item id="bed"    src="assets/models/bed/scene.gltf"></a-asset-item>
      <a-asset-item id="drumKit"    src="assets/models/drum_kit/scene.gltf"></a-asset-item>
      <a-asset-item id="fancyTable"    src="assets/models/fancy_table.glb"></a-asset-item>
      <a-asset-item id="drumChair"    src="assets/models/drum_chair/scene.gltf"></a-asset-item>
      <a-asset-item id="sofaPink"    src="assets/models/sofa_pink.glb"></a-asset-item>
      <a-asset-item id="dryingRack"    src="assets/models/drying_rack/scene.gltf"></a-asset-item>
      <a-asset-item id="modernKitchen"    src="assets/models/modern_kitchen/scene.gltf"></a-asset-item>
      <a-asset-item id="flatScreenTv"    src="assets/models/flat screen tv/scene.gltf"></a-asset-item>
      <a-asset-item id="shelfAndDrawer"    src="assets/models/shelf_and_drawer/scene.gltf"></a-asset-item>
      <a-asset-item id="tvAndChair"    src="assets/models/tv and chair/scene.gltf"></a-asset-item>
      <a-asset-item id="sofaSet"    src="assets/models/sofa_set/scene.gltf"></a-asset-item>
      <img id="groundTexture" src="assets/textures/ground.jpg">
      <img id="waterNormal" crossorigin="anonymous"
           src="https://raw.githubusercontent.com/mrdoob/three.js/r152/examples/textures/water/Water_1_M_Normal.jpg">
    </a-assets>


    <!-- SKY -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Sun disc visible from camera at z=68 looking toward -z -->
    <a-sphere position="60 55 -120" radius="5"
      material="shader: flat; color: #FFF9C4; emissive: #FFD54F; emissiveIntensity: 1.5"></a-sphere>

    <!-- LIGHTING -->
    <a-light type="ambient"     color="#CFE4FF" intensity="0.20"></a-light>
    <a-light type="directional" color="#FFF5E0" intensity="0.78"
      position="15 25 10"
      shadow="cast: true; mapSize: 2048 2048"></a-light>
    <a-light type="hemisphere"  color="#B0D4F1" ground-color="#5A8A40" intensity="0.22"></a-light>

    <!-- Interior lights around the villa -->
    <a-light type="point" color="#FF9A3C" intensity="1.3" distance="18" decay="2" position=" 4  7  5"></a-light>
    <a-light type="point" color="#FFD580" intensity="1.1" distance="14" decay="2" position="-4  7  3"></a-light>
    <a-light type="point" color="#FF8C42" intensity="0.9" distance="12" decay="2" position=" 7  5  8"></a-light>
    <a-light type="point" color="#FFBE76" intensity="0.8" distance="12" decay="2" position="-7  5  8"></a-light>
    <a-light type="point" color="#FFA64D" intensity="0.7" distance="10" decay="2" position=" 0  4  0"></a-light>
    <a-light type="point" color="#FF8C42" intensity="1.8" distance="10" decay="2" position=" 0  4  0"></a-light>
    </a-entity>

    <!-- GROUND -->
    <a-plane position="0 0 -10" rotation="-90 0 0" width="500" height="500" 
    material="src: #groundTexture; repeat: 120 120; transparent: true; opacity: 0.9" shadow="cast: true"></a-plane>

    
    <!-- ROAD -->
    <a-plane position="2.5 0.02 78" rotation="-90 0 0" width="23" height="75"
      material="color: #2e2e2e; roughness: 0.9" shadow="receive: true"></a-plane>

    <a-plane position="-7 0.5 85" rotation="-90 0 0" width="0.25" height="60" material="color: #8a7a6a; shader: flat"></a-plane>
    <a-plane position=" 12 0.5 85" rotation="-90 0 0" width="0.25" height="60" material="color: #8a7a6a; shader: flat"></a-plane>

    <!-- Road markings -->
    <a-plane position="2 0.04  60" rotation="-90 0 0" width="0.3" height="5" material="color: #fff; shader: flat"></a-plane>
    <a-plane position="2 0.04  68" rotation="-90 0 0" width="0.3" height="5" material="color: #fff; shader: flat"></a-plane>
    <a-plane position="2 0.04  76" rotation="-90 0 0" width="0.3" height="5" material="color: #fff; shader: flat"></a-plane>
    <a-plane position="2 0.04  84" rotation="-90 0 0" width="0.3" height="5" material="color: #fff; shader: flat"></a-plane>
    <a-plane position="2 0.04  92" rotation="-90 0 0" width="0.3" height="5" material="color: #fff; shader: flat"></a-plane>
    <a-plane position="2 0.04 100" rotation="-90 0 0" width="0.3" height="5" material="color: #fff; shader: flat"></a-plane>


    <!-- MAIN VILLA -->
    <a-entity id="villa" position="0 0 5" scale="3 3 3">
      <a-gltf-model src="#villaModel"></a-gltf-model>

      <!-- Transparent planes to hide inner walls -->
      <!-- Wall between living room and bedroom -->
      <a-plane position="-1.5 2 0" rotation="0 90 0" width="4" height="4"
        material="color: #ffffff; transparent: true; opacity: 0.01"></a-plane>

      <!-- Wall between living room and kitchen -->
      <a-plane position="1.5 2 -2" rotation="0 0 0" width="3" height="4"
        material="color: #ffffff; transparent: true; opacity: 0.01"></a-plane>

      <!-- Wall separating rear areas -->
      <a-plane position="0 2 -4" rotation="0 0 0" width="6" height="4"
        material="color: #ffffff; transparent: true; opacity: 0.01"></a-plane>
    </a-entity>

    
    <!-- Items inside the house -->
    <!-- Table -->
    <a-entity gltf-model="#fancyTable"
      scale="0.025 0.025 0.025"
      position="10 1.8 -2"
      rotation="0 90 0">
    </a-entity>

    <!-- Kitchen -->
    <a-entity gltf-model="#modernKitchen"
      scale="2 1.5 1.5"
      rotation="0 180 0"
      position="10 1 -10">
    </a-entity>

    <!-- Bed -->
    <a-entity gltf-model="#bed"
      scale="2 1.6 2"
      rotation="0 90 0"
      position="-10 1 -20">
    </a-entity>

      <!-- TV and chair -->
    <a-entity gltf-model="#tvAndChair"
      scale="1.6 1.6 1.6"
      rotation="0 90 0"
      position="0 1.5 -20">
    </a-entity>

    <!-- Flat screen TV -->
    <a-entity gltf-model="#flatScreenTv"
      scale="2.5 2 2"
      rotation="0 0 0"
      position="-7 4.5 -2">
    </a-entity>

    <!-- Sofa -->
    <a-entity gltf-model="#sofaSet"
      scale="-0.06 -0.06 -0.06"
      rotation="0 0 180"
      position="-7 2 9">
    </a-entity>
    
    <!-- Shelf -->
    <a-entity gltf-model="#shelfAndDrawer"
      scale="0.07 0.06 0.05"
      position="-11.5 1.8 -1">
    </a-entity>

    <!-- Pink Sofa -->
    <a-entity gltf-model="#sofaPink"
      scale="0.003 0.003 0.003"
      rotation="0 270 0"
      position="9 2 2.5">
    </a-entity>

    <!-- Drum kit -->
    <a-entity gltf-model="#drumKit"
      scale="2 1.8 3"
      rotation="0 -90 0"
      position="-13 4 -5.3">
    </a-entity>

    <!-- Drum chair -->
    <a-entity gltf-model="#drumChair"
      scale="0.003 0.004 0.005"
      position="-8 1.5 -5.3">
    </a-entity>

    <!-- Ferrari -->
    <a-entity gltf-model="#ferrari"
      scale="1.5 1.5 1.5"
      rotation="0 -90 0"
      position="30 0.3 25">
    </a-entity>

    <!-- Drying rack -->
    <a-entity gltf-model="#dryingRack"
      scale="8 12 8"
      rotation="0 90 0"
      position="19 1.6 -10">
    </a-entity>


  
    <!-- POOL -->
    <a-entity id="pool" position="-30 0 12">

  <!-- POOL MODEL-->
  <a-gltf-model 
    src="#poolModel" 
    scale="1.8 1.8 1.8"
    shadow="cast: true; receive: true">
  </a-gltf-model>

  <!-- MAIN WATER SURFACE -->
  <a-plane 
    position="0 0.6 0" 
    rotation="-90 0 0" 
    width="7" 
    height="15"
    material="color: #00BFFF; transparent: true; opacity: 0.55; roughness: 0.2; metalness: 0.3"
    water-animate>
  </a-plane>

  <!-- WATER SHINE LAYER -->
  <a-plane
    position="0 0.62 0"
    rotation="-90 0 0"
    width="6.8"
    height="14.8"
    material="color: #0288d1; opacity: 0.25; transparent: true"
    animation="property: material.opacity; from: 0.2; to: 0.35; dur: 2000; dir: alternate; loop: true">
  </a-plane>

  <!-- POOL LIGHT -->
  <a-light 
    type="point" 
    color="#00CED1" 
    intensity="0.9" 
    distance="12" 
    position="0 1 0">
  </a-light>

</a-entity>

    <!-- TREES -->
    <a-entity gltf-model="#treeModel" position="-19 0  -7" scale="1.2 1.2 1.2"></a-entity>
    <a-entity gltf-model="#treeModel" position=" 40 0  -7" scale="1.2 1.2 1.2"></a-entity>
    <a-entity gltf-model="#treeModel" position="-19 0  18" scale="1.1 1.1 1.1"></a-entity>
    <a-entity gltf-model="#treeModel" position="-12 0  44" scale="1.0 1.0 1.0"></a-entity>
    <a-entity gltf-model="#treeModel" position=" 15 0  44" scale="1.0 1.0 1.0"></a-entity>
    <!-- Roadside trees outside compound -->
    <a-entity gltf-model="#treeModel" position="-12 0  50" scale="1.1 1.1 1.1"></a-entity>
    <a-entity gltf-model="#treeModel" position=" 15 0  50" scale="1.1 1.1 1.1"></a-entity>
    <a-entity gltf-model="#treeModel" position="-14 0  70" scale="0.9 0.9 0.9"></a-entity>
    <a-entity gltf-model="#treeModel" position=" 18 0  70" scale="0.9 0.9 0.9"></a-entity>
    <a-entity gltf-model="#treeModel" position="-14 0  90" scale="0.9 0.9 0.9"></a-entity>
    <a-entity gltf-model="#treeModel" position=" 18 0  90" scale="0.9 0.9 0.9"></a-entity>
    <a-entity gltf-model="#treeModel" position="-14 0  110" scale="1.1 1.1 1.1"></a-entity>
    <a-entity gltf-model="#treeModel" position=" 18 0  110" scale="1.1 1.1 1.1"></a-entity>


    <!-- BUGATTI -->
    <a-entity id="bugatti"
      gltf-model="#bugattiModel"
      scale="2.5 2.5 2.5"
      rotation="0 90 0"
      position="30 0.3 33">
    </a-entity>



  </a-scene>
</body>
</html>
